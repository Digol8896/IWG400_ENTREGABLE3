{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Proyecto Inicial | Base de Datos</title>
    <link rel="stylesheet" href="{% static 'css/basemapa.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'img/logo.png' %}" alt="Logo de la página" class="logo">
        </div>
        <ul class="nav-links">
            <li><a class="textoheader" href="{% url 'base_inicio' %}">Inicio base de datos</a></li>
            <li><a class="textoheader" href="{% url 'inicio' %}">Inicio VGC</a></li>
        </ul>
    </nav>
    {{ mapa|json_script:"datos-mapa" }}
    <div id="mapa" class="mapa" style="height: 500px;"></div>
</body>
<script>
    const datos = JSON.parse(document.getElementById("datos-mapa").textContent);
    const mapa = L.map("mapa").setView(datos.centro, datos.zoom);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
    }).addTo(mapa);
    for (const linea of datos.lineas) {
    L.polyline(linea.puntos, {color: "#" + linea.color, weight: 4}).addTo(mapa);
    }
    for (const m of datos.marcadores) {
    const globo = document.createElement("div");
    globo.textContent = m.texto; // se muestra tal cual, no como HTML
    L.marker([m.lat, m.lon]).addTo(mapa).bindPopup(globo);
    }
</script>
